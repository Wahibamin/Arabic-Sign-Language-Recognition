name: Static validation
on:
  push:
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install lightweight checks
        run: python -m pip install -U pytest numpy pillow scikit-learn==1.6.1
      - name: Compile Python code
        run: python -m compileall -q app.py src scripts
      - name: Run offline unit tests
        run: python -m pytest -q
      - name: Verify artifact names, hashes and metadata
        run: python scripts/verify_assets.py --strict
